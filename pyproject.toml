[project]
name = "scalable-multimodal-rag-s3vectors"
version = "1.0.0"
description = "Production multimodal RAG on Amazon Bedrock Knowledge Bases and S3 Vectors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "boto3>=1.37.0",
    "aiobotocore>=2.21.0",
    "botocore>=1.37.0",
    "redis>=5.2.0",
    "numpy>=2.1.0",
    "structlog>=24.4.0",
    "aws-xray-sdk>=2.14.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    "mangum>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "boto3-stubs[bedrock-runtime,bedrock-agent,bedrock-agent-runtime,s3,sqs,cloudwatch]>=1.37.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src"]
